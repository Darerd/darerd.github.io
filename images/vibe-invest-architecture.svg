<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">VibeInvesTradingAgents 多 Agent 投研框架架构图</title>
  <desc id="desc">输入个股或基金代码后，系统进入个股投研引擎或基金投研引擎，再经过数据质量门控、牛熊辩论、风控决策和组合经理输出。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{fill:#0f172a;font:700 34px Arial,'Microsoft YaHei',sans-serif}.text{fill:#334155;font:500 19px Arial,'Microsoft YaHei',sans-serif}.small{fill:#475569;font:500 16px Arial,'Microsoft YaHei',sans-serif}.label{fill:#0f172a;font:700 22px Arial,'Microsoft YaHei',sans-serif}.node{fill:#fff;stroke:#cbd5e1;stroke-width:2}.stock{fill:#fff7ed;stroke:#f97316}.fund{fill:#eef2ff;stroke:#6366f1}.gate{fill:#ecfdf5;stroke:#10b981}.risk{fill:#fef2f2;stroke:#ef4444}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="820" rx="28"/>
  <text class="title" x="60" y="70">VibeInvesTradingAgents：双核多 Agent 投研框架</text>
  <text class="text" x="60" y="108">核心流程：多维分析 -> 数据门控 -> 牛熊辩论 -> 风控检验 -> 最终决策。</text>

  <rect class="node" x="480" y="145" width="320" height="70" rx="16"/>
  <text class="label" x="540" y="188">输入分析标的</text>
  <text class="small" x="548" y="208">个股代码 / 基金代码</text>

  <rect class="stock" x="70" y="280" width="530" height="300" rx="22"/>
  <text class="label" x="105" y="326">个股投研引擎：7 类分析师</text>
  <rect class="node" x="105" y="365" width="135" height="46" rx="10"/><text class="small" x="136" y="394">市场</text>
  <rect class="node" x="255" y="365" width="135" height="46" rx="10"/><text class="small" x="286" y="394">舆情</text>
  <rect class="node" x="405" y="365" width="135" height="46" rx="10"/><text class="small" x="436" y="394">新闻</text>
  <rect class="node" x="105" y="430" width="135" height="46" rx="10"/><text class="small" x="128" y="459">基本面</text>
  <rect class="node" x="255" y="430" width="135" height="46" rx="10"/><text class="small" x="286" y="459">政策</text>
  <rect class="node" x="405" y="430" width="135" height="46" rx="10"/><text class="small" x="428" y="459">游资</text>
  <rect class="node" x="255" y="495" width="135" height="46" rx="10"/><text class="small" x="286" y="524">解禁</text>

  <rect class="fund" x="680" y="280" width="530" height="300" rx="22"/>
  <text class="label" x="715" y="326">基金投研引擎：3 类分析师</text>
  <rect class="node" x="725" y="385" width="420" height="48" rx="10"/><text class="small" x="845" y="416">基金经理分析</text>
  <rect class="node" x="725" y="455" width="420" height="48" rx="10"/><text class="small" x="845" y="486">业绩表现分析</text>
  <rect class="node" x="725" y="525" width="420" height="48" rx="10"/><text class="small" x="845" y="556">持仓穿透分析</text>

  <rect class="gate" x="395" y="650" width="230" height="78" rx="16"/>
  <text class="label" x="438" y="686">数据质量门控</text>
  <text class="small" x="435" y="710">硬检查 + 语义复审</text>
  <rect class="node" x="675" y="650" width="180" height="78" rx="16"/>
  <text class="label" x="712" y="686">牛熊辩论</text>
  <text class="small" x="706" y="710">正反观点碰撞</text>
  <rect class="risk" x="905" y="650" width="180" height="78" rx="16"/>
  <text class="label" x="942" y="686">风险决策</text>
  <text class="small" x="926" y="710">交易与仓位约束</text>

  <path class="arrow" d="M555 215 C450 235 340 255 300 280"/>
  <path class="arrow" d="M725 215 C830 235 940 255 980 280"/>
  <path class="arrow" d="M335 580 C380 615 435 635 500 650"/>
  <path class="arrow" d="M945 580 C890 615 820 635 760 650"/>
  <path class="arrow" d="M625 689 L675 689"/>
  <path class="arrow" d="M855 689 L905 689"/>
  <path class="arrow" d="M1085 689 C1145 689 1170 650 1170 610"/>
  <rect class="node" x="1085" y="540" width="150" height="68" rx="14"/>
  <text class="label" x="1122" y="577">最终结论</text>
  <text class="small" x="1118" y="598">PM 输出报告</text>
</svg>
