<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">财富自由从结余开始</title>
  <desc id="desc">收入、结余、资产、收益和再投资构成财富增长路径。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>

  <text x="600" y="64" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#0f172a">财富自由从“结余”开始</text>
  <text x="600" y="104" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">先让收入留下来，再让留下来的钱变成资产</text>

  <g stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)">
    <path d="M258 260 H332"/>
    <path d="M522 260 H596"/>
    <path d="M786 260 H860"/>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" filter="url(#shadow)">
    <g>
      <rect x="78" y="178" width="180" height="164" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
      <text x="168" y="240" text-anchor="middle" font-size="30" font-weight="700" fill="#0f766e">收入</text>
      <text x="168" y="278" text-anchor="middle" font-size="17" fill="#475569">提高赚钱能力</text>
      <text x="168" y="306" text-anchor="middle" font-size="15" fill="#94a3b8">速度</text>
    </g>

    <g>
      <rect x="342" y="178" width="180" height="164" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
      <text x="432" y="240" text-anchor="middle" font-size="30" font-weight="700" fill="#2563eb">结余</text>
      <text x="432" y="278" text-anchor="middle" font-size="17" fill="#475569">控制支出负债</text>
      <text x="432" y="306" text-anchor="middle" font-size="15" fill="#94a3b8">第一桶水</text>
    </g>

    <g>
      <rect x="606" y="178" width="180" height="164" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
      <text x="696" y="240" text-anchor="middle" font-size="30" font-weight="700" fill="#7c3aed">资产</text>
      <text x="696" y="278" text-anchor="middle" font-size="17" fill="#475569">购买优质资产</text>
      <text x="696" y="306" text-anchor="middle" font-size="15" fill="#94a3b8">距离</text>
    </g>

    <g>
      <rect x="870" y="178" width="180" height="164" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="4"/>
      <text x="960" y="240" text-anchor="middle" font-size="30" font-weight="700" fill="#d97706">收益</text>
      <text x="960" y="278" text-anchor="middle" font-size="17" fill="#475569">现金流和增值</text>
      <text x="960" y="306" text-anchor="middle" font-size="15" fill="#94a3b8">助推器</text>
    </g>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <path d="M960 362 C880 432 642 458 452 374" stroke="#be123c" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
    <rect x="458" y="398" width="284" height="62" rx="31" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
    <text x="600" y="437" text-anchor="middle" font-size="22" font-weight="700" fill="#be123c">收益继续再投资，复利开始滚动</text>
  </g>
</svg>
