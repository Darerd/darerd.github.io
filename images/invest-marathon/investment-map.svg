<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">个人投资地图</title>
  <desc id="desc">用年收入、可投资资产、负债和现金流四个维度判断投资起点。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="480" y="64" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#0f172a">先问“我在哪里”，再问“买什么”</text>
  <text x="480" y="102" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">你的投资起点，不是一个数字，而是一张财务地图</text>

  <g filter="url(#shadow)">
    <circle cx="480" cy="292" r="96" fill="#ffffff"/>
    <text x="480" y="278" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0f172a">投资起点</text>
    <text x="480" y="313" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748b">风险边界与资产策略</text>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <g>
      <rect x="98" y="164" width="250" height="104" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="223" y="206" text-anchor="middle" font-size="24" font-weight="700" fill="#0f766e">年收入</text>
      <text x="223" y="238" text-anchor="middle" font-size="16" fill="#475569">未来创造现金流的能力</text>
    </g>
    <g>
      <rect x="612" y="164" width="250" height="104" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="737" y="206" text-anchor="middle" font-size="24" font-weight="700" fill="#2563eb">可投资资产</text>
      <text x="737" y="238" text-anchor="middle" font-size="16" fill="#475569">已经积累下来的本金</text>
    </g>
    <g>
      <rect x="98" y="338" width="250" height="104" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="223" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#b45309">负债</text>
      <text x="223" y="412" text-anchor="middle" font-size="16" fill="#475569">背在身上的财务重量</text>
    </g>
    <g>
      <rect x="612" y="338" width="250" height="104" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="737" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#9333ea">现金流</text>
      <text x="737" y="412" text-anchor="middle" font-size="16" fill="#475569">能否持续留在赛道上</text>
    </g>
  </g>

  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <path d="M348 216 C392 226 421 246 441 260"/>
    <path d="M612 216 C568 226 539 246 519 260"/>
    <path d="M348 390 C392 374 421 346 441 324"/>
    <path d="M612 390 C568 374 539 346 519 324"/>
  </g>
</svg>
